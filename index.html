<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MVHS Student Coded Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  /* =========================================================
     COLORS — Mountain Vista green & gold (taken from the logo)
     ========================================================= */
  :root {
    --green-deep: #0E2E18;
    --green: #123A1E;
    --green-mid: #1E5530;
    --gold: #DBD39B;      /* the logo's khaki gold */
    --gold-bright: #E9C547;
    --ink: #0A0A0A;

    --bg: #F3EFD6;
    --surface: #FFFDF2;
    --text: #123A1E;
    --text-soft: #3F5A45;
    --tile-border: #123A1E;
    --tile-shadow: #123A1E;

    color-scheme: light;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0E2E18; --surface: #163F23; --text: #F3EFD6; --text-soft: #C9C29A;
      --tile-border: #DBD39B; --tile-shadow: #050F08; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0E2E18; --surface: #163F23; --text: #F3EFD6; --text-soft: #C9C29A;
    --tile-border: #DBD39B; --tile-shadow: #050F08; color-scheme: dark;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Chakra Petch", "Trebuchet MS", system-ui, sans-serif;
    line-height: 1.45;
  }

  /* ---------- Header / hero ---------- */
  header {
    background: var(--green);
    color: var(--gold);
    border-bottom: 10px solid var(--gold);
    /* gold diagonal "speed" stripes, like a mountain ridge */
    background-image: repeating-linear-gradient(-35deg, transparent 0 38px, rgba(219,211,155,.06) 38px 76px);
  }
  .hero {
    max-width: 1100px;
    margin: 0 auto;
    padding: 2rem 1.25rem 2.25rem;
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 1.75rem;
    align-items: center;
  }
  .badge {
    width: clamp(120px, 22vw, 190px);
    aspect-ratio: 1;
    border-radius: 50%;
    background: var(--gold);
    border: 6px solid var(--gold-bright);
    display: grid;
    place-items: center;
    box-shadow: 0 0 0 6px var(--green-deep);
  }
  .badge img { width: 82%; height: auto; display: block; }
  h1 {
    margin: 0;
    font-weight: 700;
    font-size: clamp(2rem, 6vw, 4rem);
    line-height: 1;
    letter-spacing: .01em;
    color: var(--gold);
    text-shadow: 4px 4px 0 var(--green-deep);
  }
  .tagline {
    margin: .75rem 0 0;
    font-size: clamp(1rem, 2vw, 1.2rem);
    color: #F3EFD6;
    max-width: 52ch;
  }
  .count { color: var(--gold-bright); font-weight: 700; }

  /* ---------- Filter buttons ---------- */
  .filters {
    max-width: 1100px;
    margin: 1.75rem auto .5rem;
    padding: 0 1.25rem;
    display: flex;
    flex-wrap: wrap;
    gap: .5rem;
  }
  .filters button {
    font: inherit;
    font-weight: 600;
    padding: .4rem 1rem;
    border-radius: 999px;
    border: 2px solid var(--tile-border);
    background: transparent;
    color: var(--text);
    cursor: pointer;
  }
  .filters button[aria-pressed="true"] { background: var(--green); color: var(--gold); border-color: var(--green); }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .filters button[aria-pressed="true"] { background: var(--gold); color: var(--green); border-color: var(--gold); }
  }

  /* ---------- Game grid ---------- */
  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 1rem 1.25rem 3rem;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 1.25rem;
    list-style: none;
    margin: 0;
    padding: 0;
  }

  /* Each game is a big clickable "cartridge" button */
  .game {
    display: flex;
    flex-direction: column;
    height: 100%;
    text-decoration: none;
    color: var(--text);
    background: var(--surface);
    border: 3px solid var(--tile-border);
    border-radius: 14px 14px 4px 4px;
    box-shadow: 6px 6px 0 var(--tile-shadow);
    overflow: hidden;
    transition: transform .12s ease, box-shadow .12s ease;
  }
  a.game:hover { transform: translate(-3px, -3px); box-shadow: 9px 9px 0 var(--tile-shadow); }
  a.game:active { transform: translate(3px, 3px); box-shadow: 2px 2px 0 var(--tile-shadow); }
  a.game:focus-visible { outline: 4px solid var(--gold-bright); outline-offset: 4px; }

  .art {
    background: var(--green);
    border-bottom: 3px solid var(--tile-border);
    padding: 1.1rem .5rem;
    text-align: center;
    font-size: 3rem;
    line-height: 1;
    letter-spacing: .1em;
    position: relative;
  }
  .rating {
    position: absolute;
    top: .5rem; right: .5rem;
    font-size: .75rem;
    font-weight: 700;
    letter-spacing: 0;
    background: var(--ink);
    color: #fff;
    border: 2px solid #fff;
    padding: .1rem .4rem;
    border-radius: 3px;
  }
  .info { padding: .85rem 1rem 1rem; display: flex; flex-direction: column; gap: .6rem; flex: 1; }
  .title { font-size: 1.2rem; font-weight: 700; line-height: 1.15; margin: 0; }
  .meta { display: flex; justify-content: space-between; align-items: center; margin-top: auto; gap: .5rem; }
  .tool {
    font-size: .8rem;
    font-weight: 600;
    color: var(--text-soft);
    border: 1.5px solid currentColor;
    border-radius: 4px;
    padding: .05rem .45rem;
  }
  .play {
    font-weight: 700;
    background: var(--gold-bright);
    color: var(--green-deep);
    padding: .3rem .8rem;
    border-radius: 6px;
    border: 2px solid var(--green-deep);
  }

  /* Games without a link yet */
  .game.soon { opacity: .6; border-style: dashed; box-shadow: none; }
  .game.soon .play { background: transparent; color: var(--text-soft); border-color: currentColor; border-style: dashed; }

  footer { text-align: center; padding: 1.5rem 1rem 2.5rem; color: var(--text-soft); font-size: .95rem; }

  @media (max-width: 560px) {
    .hero { grid-template-columns: 1fr; justify-items: center; text-align: center; }
    .tagline { margin-inline: auto; }
  }
  @media (prefers-reduced-motion: reduce) { .game { transition: none; } }
</style>
</head>

const grid = document.getElementById("games");
const filterBar = document.getElementById("filters");

// Escape text so titles with symbols display safely
function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

// Draw the game tiles (optionally only one tool)
function render(filter) {
  grid.innerHTML = "";
  games
    .filter(g => filter === "All" || g.tool === filter)
    .forEach(g => {
      const hasLink = g.url && g.url.startsWith("http");
      const badge = g.rating ? `<span class="rating" title="Rated ${esc(g.rating)}">${esc(g.rating)}</span>` : "";
      const inner = `
        <div class="art" aria-hidden="true">${g.emoji}${badge}</div>
        <div class="info">
          <p class="title">${esc(g.title)}</p>
          <div class="meta">
            <span class="tool">${esc(g.tool)}</span>
            <span class="play">${hasLink ? "Play" : "Coming soon"}</span>
          </div>
        </div>`;
      const li = document.createElement("li");
      li.innerHTML = hasLink
        ? `<a class="game" href="${esc(g.url)}" target="_blank" rel="noopener">${inner}</a>`
        : `<div class="game soon">${inner}</div>`;
      grid.appendChild(li);
    });
}

// Build the filter buttons: "All" plus one per tool used
const tools = ["All", ...new Set(games.map(g => g.tool))];
tools.forEach(t => {
  const b = document.createElement("button");
  b.type = "button";
  b.textContent = t;
  b.setAttribute("aria-pressed", t === "All" ? "true" : "false");
  b.addEventListener("click", () => {
    filterBar.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", "false"));
    b.setAttribute("aria-pressed", "true");
    render(t);
  });
  filterBar.appendChild(b);
});

// Show how many games are playable
const playable = games.filter(g => g.url && g.url.startsWith("http")).length;
document.getElementById("count").textContent = `${playable} games ready to play.`;

render("All");
</script>
</body>
</html>
